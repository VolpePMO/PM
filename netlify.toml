# Deploy do Valori PM na Netlify.
#
# O preset "netlify" do Nitro (definido em vite.config.ts) separa a saída em
# dois lugares: os arquivos estáticos vão para `dist/` e a função de SSR para
# `.netlify/functions-internal/server/`. Por isso `publish` é "dist" — só o
# preset "node-server" usa `.output/public`.
#
# Não é preciso redirect de catch-all: a própria função declara
# `config = { path: "/*", preferStatic: true }`, então a Netlify serve o arquivo
# estático quando ele existe e cai na função em todo o resto.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

  # O npm 10.9.x que vem com o Node 22 tem um bug no resolvedor de dependências
  # ("Cannot read properties of null (reading 'edgesOut')") que derruba o
  # `npm install` deste projeto. Com o package-lock.json commitado a Netlify roda
  # `npm ci`, que lê o lock direto e não passa por esse caminho — mas pedir o npm
  # 11 aqui cobre também o caso de o lock sair de sincronia com o package.json e
  # a Netlify cair de volta no `npm install`.
  NPM_VERSION = "11"

# As variáveis do Supabase entram em Site configuration → Environment
# variables, não aqui: este arquivo vai para o repositório.
#   VITE_SUPABASE_URL
#   VITE_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_URL                  (mesmo valor, usado no SSR)
#   SUPABASE_PUBLISHABLE_KEY      (mesmo valor, usado no SSR)
#   SUPABASE_SERVICE_ROLE_KEY     (só servidor — sustenta o painel administrativo)
#
# A service_role ignora o RLS inteiro. Sem o prefixo VITE_ ela fica só no
# servidor; com o prefixo, iria para o bundle do navegador e vazaria o banco.
